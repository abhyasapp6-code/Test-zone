<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — CMA Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="center-wrap">
  <div class="card auth-card narrow">

    <a class="brand" href="index.html">
      <span class="brand-mark">▮▮▮</span>
      CMA <b>Tracker</b>
    </a>

    <div class="eyebrow">WELCOME BACK</div>

    <h2>Login</h2>

    <p class="muted">
      Continue your CMA preparation.
    </p>

    <form id="loginForm">

      <label>
        Email
        <input
          id="email"
          type="email"
          required
        >
      </label>

      <label>
        Password
        <input
          id="password"
          type="password"
          required
        >
      </label>

      <button
        class="btn primary full"
        type="submit"
      >
        Login →
      </button>

    </form>

    <button
      class="btn google full"
      id="googleLogin"
      type="button"
    >
      🌈 Continue with Google
    </button>

    <button
      class="btn secondary full"
      id="forgot"
      type="button"
    >
      Forgot password?
    </button>

    <p class="center muted">
      New here?
      <a href="register.html">Create an account</a>
    </p>

  </div>
</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>


<script>

/* ================================
   CHECK GOOGLE LOGIN RETURN
================================ */

let redirectHandled = false;

window.fbAuth.onAuthStateChanged(async function(firebaseUser) {

  if (!firebaseUser || redirectHandled) {
    return;
  }

  redirectHandled = true;

  try {

    let user = null;

    /*
      First try to get the Google redirect result.
    */

    try {
      user = await window.handleGoogleRedirect();
    } catch (error) {
      console.log("Redirect result check:", error);
    }

    /*
      If redirect result is already consumed,
      use the currently authenticated Firebase user.
    */

    if (!user) {

      const currentUser = window.fbAuth.currentUser;

      if (currentUser) {

        /*
          Load/create the CMA Tracker profile.
        */

        const snap = await window.fbDb
          .collection("users")
          .doc(currentUser.uid)
          .get();

        if (snap.exists) {

          user = {
            uid: currentUser.uid,
            ...snap.data()
          };

        } else {

          /*
            Google account authenticated,
            but CMA Tracker profile doesn't exist yet.
          */

          user = {
            uid: currentUser.uid,
            name: currentUser.displayName || "CMA Student",
            email: currentUser.email || "",
            course: null,
            groups: [],
            attempt: null,
            dailyHours: 4,
            preferredTime: "Morning",
            weeklyOff: "Sunday",
            setup: false,
            role: "student"
          };

          await window.fbDb
            .collection("users")
            .doc(currentUser.uid)
            .set({
              ...user,
              createdAt:
                firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        localStorage.setItem(
          "cmaUser",
          JSON.stringify(user)
        );
      }
    }

    if (!user) {
      redirectHandled = false;
      return;
    }

    /*
      LOGIN SUCCESS
    */

    if (user.setup === true) {

      window.location.replace("dashboard.html");

    } else {

      window.location.replace("setup.html");

    }

  } catch (error) {

    console.error(
      "Google return handling error:",
      error
    );

    redirectHandled = false;

    alert(
      error.message ||
      "Unable to complete Google login."
    );

  }

});


/* ================================
   NORMAL EMAIL LOGIN
================================ */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const btn = e.submitter;

    btn.disabled = true;

    try {

      const user = await window.loginCMAUser(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      if (user.setup === true) {

        window.location.replace("dashboard.html");

      } else {

        window.location.replace("setup.html");

      }

    } catch (error) {

      console.error(error);

      if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/user-not-found"
      ) {

        alert("Invalid email or password.");

      } else {

        alert(
          error.message ||
          "Login failed."
        );

      }

    } finally {

      btn.disabled = false;

    }

  });


/* ================================
   GOOGLE LOGIN BUTTON
================================ */

document
  .getElementById("googleLogin")
  .addEventListener("click", async function() {

    const btn = this;

    btn.disabled = true;

    try {

      await window.startGoogleLogin();

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Google login failed."
      );

      btn.disabled = false;

    }

  });


/* ================================
   FORGOT PASSWORD
================================ */

document
  .getElementById("forgot")
  .addEventListener("click", async function() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      alert("Enter your email first.");

      return;

    }

    try {

      await window.fbAuth.sendPasswordResetEmail(email);

      alert("Password reset email sent.");

    } catch (error) {

      alert(
        error.message ||
        "Unable to send reset email."
      );

    }

  });

</script>
  

</body>
</html>
