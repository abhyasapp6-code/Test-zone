<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — CMA Tracker</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="center-wrap"><div class="card auth-card narrow"><a class="brand" href="index.html"><span class="brand-mark">▮▮▮</span> CMA <b>Tracker</b></a><div class="eyebrow">WELCOME BACK</div><h2>Login</h2><p class="muted">Continue your CMA preparation.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary full">Login →</button></form><button class="btn google full" id="googleLogin" type="button">🌈 Continue with Google</button><button class="btn secondary full" id="forgot" type="button">Forgot password?</button><p class="center muted">New here? <a href="register.html">Create an account</a></p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async e=>{e.preventDefault(); const btn=e.submitter; btn.disabled=true; try{const u=await loginCMAUser(email.value.trim(),password.value); location.href=u.setup?"dashboard.html":"setup.html";}catch(err){alert(err.code==="auth/invalid-credential"||err.code==="auth/user-not-found"?"Invalid email or password.":err.message||"Login failed.");}finally{btn.disabled=false;}});
document.getElementById("googleLogin").onclick=async()=>{try{const u=await googleCMAUser();location.href=u.setup?"dashboard.html":"setup.html";}catch(err){alert(err.message||"Google login failed.");}};
document.getElementById("forgot").onclick=async()=>{const e=email.value.trim();if(!e)return alert("Enter your email first.");try{await fbAuth.sendPasswordResetEmail(e);alert("Password reset email sent.");}catch(err){alert(err.message||"Unable to send reset email.");}};
</script></body></html>
